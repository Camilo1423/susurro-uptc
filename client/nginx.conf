server {
  listen 80;
  server_name _;

  # Sirve los archivos generados por Vite
  root /usr/share/nginx/html;
  index index.html;

  # Favicon explícito (evita que caiga al fallback del SPA)
  location = /favicon.ico {
    try_files /favicon.ico =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
  }

  # Archivos estáticos con caché (coloca esto ANTES del fallback)
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|ttf|otf|woff2?)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html: NUNCA se cachea, para que tras un redeploy siempre apunte a los
  # chunks del build actual (evita "Failed to fetch dynamically imported module"
  # por un index.html viejo que pide un assets/*.js que ya no existe).
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # Fallback del SPA (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html { }
}